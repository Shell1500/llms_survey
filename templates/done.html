{% extends "base.html" %}

{% block content %}
<section class="flex flex-1 items-center justify-center">
  <div class="w-full max-w-xl rounded-3xl bg-white p-10 text-center shadow-xl ring-1 ring-slate-100">
    <p class="text-sm font-semibold uppercase tracking-[0.3em] text-slate-500">
      Thank You
    </p>
    <h1 class="mt-3 text-3xl font-semibold text-slate-900">
      Session Complete
    </h1>
    <p class="mt-4 text-base text-slate-600">
      Your responses have been securely logged. You may close this window or return to
      the lab facilitator for the next steps.
    </p>
    <a
      href="/"
      class="mt-8 inline-flex items-center justify-center rounded-2xl border border-slate-200 px-6 py-3 text-sm font-semibold text-slate-700 transition hover:border-slate-300 hover:bg-slate-50"
    >
      Restart Survey
    </a>
  </div>
</section>
{% endblock %}
